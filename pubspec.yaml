name: tribhuban_customer_app
description: "Tribhuban Concepts — Premium FMCG Bundle Commerce Platform (Customer App)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Functional error handling
  dartz: ^0.10.1
  equatable: ^2.0.5

  # UI / Design system
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Forms & validation
  formz: ^0.7.0

  # Storage & security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Networking utilities
  connectivity_plus: ^6.0.3
  dio: ^5.4.3+1

  # Utilities
  intl: ^0.19.0
  logger: ^2.3.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # fonts:
  #   - family: TribhubanDisplay
  #     fonts:
  #       - asset: assets/fonts/TribhubanDisplay-Regular.ttf
  #       - asset: assets/fonts/TribhubanDisplay-Bold.ttf
  #         weight: 700
